services:
  # ========================================================
  # Banco de Dados MySQL 8.0
  # ========================================================
  db:
    image: mysql:8.0
    container_name: odontogest-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: almoxarifado_saude_db
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./almoxarifado_saude_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ========================================================
  # Interface Visual do Banco de Dados (phpMyAdmin)
  # ========================================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: odontogest-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      db:
        condition: service_healthy

  # ========================================================
  # Aplicação OdontoGest (Fastify Backend + React Vite SPA)
  # ========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: odontogest-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DATABASE_URL=mysql://root:root@db:3306/almoxarifado_saude_db
      - COOKIE_SECRET=super-secret-key-pbs-saude-owasp-2026
      - DEBUG_PRISMA=false
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
    name: odontogest_mysql_data
